<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R2 SSE spike</title>
    <!-- htmx 4 beta: SSE is bundled in core, auto-registers (no hx-ext needed) -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background:#0f172a; color:#e2e8f0; }
        #left { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        #right { width: 360px; padding: 16px; background:#1e293b; }
        h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color:#94a3b8; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
        .msg.user { align-self: flex-end; background:#2563eb; }
        .msg.ai { align-self: flex-start; background:#334155; }
        form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #334155; }
        input[name=message] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background:#0f172a; color:#e2e8f0; }
        button { padding: 10px 16px; border-radius: 8px; border: 0; background:#22c55e; color:#04210f; font-weight:600; cursor:pointer; }
        #panel { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px; min-height:60px; font-size:13px; color:#fbbf24; }
        .log { margin-top:16px; font-size:11px; color:#64748b; white-space:pre-wrap; max-height:40vh; overflow:auto; }
    </style>
</head>
<body hx-ext="sse">
    <div id="left">
        <div id="messages"></div>
        <!-- POST returns user+assistant bubbles; assistant bubble opens its own SSE -->
        <form hx-post="/send" hx-target="#messages" hx-swap="beforeend"
              hx-on::after-request="this.reset()">
            <input name="message" placeholder="Plan a trip…" autocomplete="off" autofocus />
            <button type="submit">Send</button>
        </form>
    </div>
    <div id="right">
        <h2>Right panel (updated via OOB-over-SSE)</h2>
        <div id="panel">— waiting —</div>
        <div class="log" id="log"></div>
    </div>

    <script>
        // Instrument SSE lifecycle so we can SEE whether OOB fires and whether
        // the connection closes cleanly (no reconnect storm).
        const log = (m) => {
            const el = document.getElementById('log');
            el.textContent += m + "\n";
        };
        document.body.addEventListener('htmx:sseOpen',  () => log('sseOpen'));
        document.body.addEventListener('htmx:sseClose', (e) => log('sseClose type=' + (e.detail && e.detail.type)));
        document.body.addEventListener('htmx:sseError', (e) => log('sseError ' + JSON.stringify(e.detail||{})));
        document.body.addEventListener('htmx:sseBeforeMessage', () => log('sseBeforeMessage'));
        document.body.addEventListener('htmx:oobBeforeSwap', () => log('oobBeforeSwap (OOB DETECTED ✅)'));
    </script>
</body>
</html>
